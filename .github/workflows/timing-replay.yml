name: Scripted timing replay

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripted-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test evaluation/replay-timing.test.ts
      - run: node --experimental-strip-types evaluation/replay-timing.ts --judge scripted > /dev/null
